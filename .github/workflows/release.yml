name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, for example v0.1.0
        required: true
        type: string
      npm:
        description: Also publish to npm (the npm environment admits only runs from a v* tag)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      file: ${{ steps.pack.outputs.file }}
    steps:
      - name: Validate the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid tag: $TAG" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: npm ci
      - run: npm audit signatures
      # Ubuntu 24.04 restricts the unprivileged user namespaces that Chrome's sandbox needs; Altimeter never disables that sandbox.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run check
      - name: Check that the package version matches the tag
        env:
          TAG: ${{ inputs.tag }}
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"
      - run: npm run build
      - name: Pack
        id: pack
        run: echo "file=$(npm pack --silent)" >> "$GITHUB_OUTPUT"
      - name: Attest the build provenance of the package
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.file }}
      - name: Attach the package and its provenance to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          FILE: ${{ steps.pack.outputs.file }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          # One attestation bundle per line, as gh attestation download writes them.
          node -e 'process.stdout.write(JSON.stringify(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))) + "\n")' "$BUNDLE" > "$FILE.intoto.jsonl"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" "$FILE.intoto.jsonl" --clobber
          else
            node scripts/release-notes.mjs "$TAG" > "$RUNNER_TEMP/notes.md"
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "$FILE" "$FILE.intoto.jsonl"
          fi
      - if: inputs.npm
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ steps.pack.outputs.file }}
          if-no-files-found: error

  npm:
    name: npm
    needs: package
    if: inputs.npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      - name: Publish the attested package to npm with provenance
        env:
          FILE: ${{ needs.package.outputs.file }}
        run: npm publish "$FILE" --provenance --access public
