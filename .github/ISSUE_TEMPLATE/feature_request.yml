name: Feature request
description: Propose a new check, data source or report capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you need to find out or fix, and why the current report does not cover it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The behavior you suggest, and the official guidance it would rely on.
    validations:
      required: true
